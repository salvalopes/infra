name: Deploy Reutilizável

on:
  workflow_call:
    inputs:
      app_name:
        required: true
        type: string
      server_path:
        required: true
        type: string
      image_api:
        required: false
        type: string
        default: ''
      image_frontend:
        required: false
        type: string
        default: ''
      dockerfile_path:
        required: false
        type: string
        default: ./Dockerfile
      frontend_context:
        required: false
        type: string
        default: ./SbsImoveis.Admin
      frontend_build_args:
        required: false
        type: string
        default: ''
    secrets:
      SSH_PRIVATE_KEY:
        required: true
      SSH_HOST:
        required: true
      SSH_USER:
        required: true
      GHCR_TOKEN:
        required: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build e Push API
        if: ${{ inputs.image_api != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile_path }}
          platforms: linux/amd64
          push: true
          tags: ${{ inputs.image_api }}:latest

      - name: Build e Push Frontend
        if: ${{ inputs.image_frontend != '' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.frontend_context }}
          platforms: linux/amd64
          push: true
          tags: ${{ inputs.image_frontend }}:latest
          build-args: ${{ inputs.frontend_build_args }}

      - name: Deploy no servidor
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ inputs.server_path }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --force-recreate
